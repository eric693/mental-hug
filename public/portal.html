<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>擁抱心理 個案專區</title>
  <link rel="stylesheet" href="/css/style.css">
  <meta name="theme-color" content="#4e5556">
  <style>
    body { background: #eef3f4; }
    .fam-wrap { max-width: 560px; margin: 0 auto; padding-bottom: 76px; min-height: 100vh; }
    .fam-head {
      background: linear-gradient(140deg, var(--primary), #2f3435); color: #fff;
      padding: 18px 18px 16px; border-radius: 0 0 18px 18px;
    }
    .fam-head h1 { font-size: 18px; }
    .fam-head .sub { font-size: 13px; color: rgba(255,255,255,0.85); margin-top: 3px; }
    .fam-body { padding: 14px; }
    .fam-nav {
      position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--border);
      display: flex; max-width: 560px; margin: 0 auto; z-index: 40;
    }
    .fam-nav button {
      flex: 1; background: none; border: none; padding: 9px 0 10px; cursor: pointer;
      font-size: 12.5px; color: var(--muted); line-height: 1.3; position: relative;
    }
    .fam-nav button.on { color: var(--primary-dark); font-weight: 700; }
    .fam-nav .nav-badge {
      position: absolute; top: 3px; right: 50%; margin-right: -26px; min-width: 16px; height: 16px;
      background: #d64545; color: #fff; border-radius: 8px; font-size: 10.5px; line-height: 16px; padding: 0 4px;
    }
    .logout-link { color: rgba(255,255,255,0.85); font-size: 13px; float: right; background: none; border: none; cursor: pointer; }
    .slot-btn { margin: 4px 4px 0 0; }
    .crisis {
      background: var(--danger-bg); color: var(--danger); border-radius: 10px;
      padding: 10px 12px; font-size: 13px; line-height: 1.7; margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast"></div>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/portal.js"></script>
  <script>Portal.boot();</script>
</body>
</html>
